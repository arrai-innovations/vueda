commit-msg:
    commands:
        commitlint:
            run: pnpm -C . exec commitlint --edit "$1"

pre-commit:
    parallel: false
    commands:
        fix-file-modes:
            glob: "**/*.{py,js,cjs,mjs,ts,tsx,vue,css,scss,less,json,yml,yaml,toml,md,html}"
            run: |
                for f in {staged_files}; do
                    if [ "$(git ls-files --format '%(objectmode)' -- "$f")" = "100755" ]; then
                        if git show :"$f" 2>/dev/null | head -1 | grep -q '^#!'; then
                            continue
                        fi
                        git update-index --chmod=-x -- "$f"
                        chmod -x "$f"
                        echo "fix-file-modes: removed +x from $f"
                    fi
                done
        ruff-check:
            root: "."
            run: |
                if [ -z "${CI:-}" ]; then
                  exit 0
                fi
                set -e
                uv run --group dev --no-sync ruff check server docs-tooling/py scripts
                python "$(git rev-parse --show-toplevel)/scripts/check_template_parity.py" --scope server
        ruff-format:
            root: "."
            run: |
                if [ -z "${CI:-}" ]; then
                  exit 0
                fi
                uv run --group dev --no-sync ruff format --check server docs-tooling/py scripts
        eslint:
            root: "."
            run: |
                if [ -z "${CI:-}" ]; then
                  exit 0
                fi
                pnpm exec eslint --no-warn-ignored --cache client docs docs-tooling eslint.config.mjs
                python "$(git rev-parse --show-toplevel)/scripts/check_template_parity.py" --scope client
        prettier:
            root: "."
            run: |
                if [ -z "${CI:-}" ]; then
                  exit 0
                fi
                pnpm exec prettier --check .
        md-toc:
            run: |
                if [ -z "${CI:-}" ]; then
                  exit 0
                fi
                files="$(find $PWD -name 'README.md' -not -path '*/node_modules/*' -not -path '*/.venv/*')"
                if [ -n "$files" ]; then
                  uv run --group dev --no-sync python -m md_toc -p github $files
                fi
        fix-ruff:
            stage_fixed: true
            glob: "**/*.py"
            exclude: &py-exclude
                - ".uv-cache/**"
                - ".claude/**"
                - ".venv/**"
                - "**/.venv/**"
                - "**/node_modules/**"
            run: |
                uv run --group dev --no-sync ruff check --fix --show-fixes {staged_files}
                uv run --group dev --no-sync ruff format {staged_files}
        check-ruff:
            glob: "**/*.py"
            exclude: *py-exclude
            run: uv run --group dev --no-sync ruff check {staged_files}
        fix-eslint:
            stage_fixed: true
            glob: "**/*.{vue,js,cjs,mjs,jsx}"
            exclude:
                - ".uv-cache/**"
                - ".claude/**"
                - "**/node_modules/**"
                - "**/dist/**"
                - "**/coverage/**"
                - "docs/reference/api/**"
                - "docs/public/api/**"
                - "docs/.generated/**"
                - "docs-tooling/.generated/**"
                - "docs/public/assets/mermaid/mermaid.min.js"
                - "templates/**"
            run: pnpm exec eslint --no-warn-ignored --cache --fix {staged_files}
        fix-prettier:
            stage_fixed: true
            glob: "**/*.{less,scss,css,vue,js,mjs,cjs,markdown,json,md,yml,yaml,html}"
            exclude:
                - ".uv-cache/**"
                - ".claude/**"
                - "**/node_modules/**"
                - "**/dist/**"
                - "**/coverage/**"
                - "pnpm-lock.yaml"
                - "package-lock.json"
                - "uv.lock"
                - "client/package.json"
                - "docs/package.json"
                - "docs-tooling/package.json"
                - "docs/reference/api/**"
                - "docs/public/api/**"
                - "docs/.generated/**"
                - "docs/.vitepress/cache/**"
                - "docs/.vitepress/dist/**"
                - "docs/.vitepress/.temp/**"
                - "docs-tooling/.generated/**"
                - "docs/public/assets/mermaid/mermaid.min.js"
                - "**/AGENT.md"
                - "**/AGENTS.md"
            run: pnpm exec prettier --write {staged_files}
        fix-md-toc:
            stage_fixed: true
            glob: "**/README.md"
            run: uv run --group dev --no-sync python -m md_toc -p github {staged_files}
        validate-doc-refs:
            glob: "docs/**/*.md"
            exclude:
                - "docs/reference/api/**"
                - "docs/.generated/**"
                - "docs/.vitepress/**"
                - "**/AGENTS.md"
            run: docs-tooling/bin/docs-tooling.js validate --files {staged_files}
        validate-doc-sources:
            glob:
                - "client/lib/theme/vueda-tailwind/**/*.js"
            run: docs-tooling/bin/docs-tooling.js validate-sources --files {staged_files}
        circleci-config:
            glob: ".circleci/*.yml"
            run: |
                command -v circleci > /dev/null 2>&1 || exit 0
                for file in {staged_files}; do
                  circleci config validate "$file"
                done
        circleci-orb-versions:
            glob: ".circleci/*.yml"
            run: python "$(git rev-parse --show-toplevel)/scripts/check_circleci_orb_versions.py"
