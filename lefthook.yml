# Commit message validation (runs locally + CI when invoked)
commit-msg:
  commands:
    commitlint:
      run: pnpm -C . exec commitlint --edit "$1"

# pre-commit hooks:
# - "check" commands are CI-only full-repo checks (skip locally for speed)
# - "fix" commands run locally on staged files and restage changes
pre-commit:
  parallel: false
  commands:
    # CI-only full-repo checks (lint + format in check mode).
    # Guarded to avoid running the full suite on every local commit.
    ruff-check:
      root: "server/"
      run: |
        if [ -z "${CI:-}" ]; then
          exit 0
        fi
        uv run --no-sync ruff check .
    ruff-format:
      root: "server/"
      run: |
        if [ -z "${CI:-}" ]; then
          exit 0
        fi
        uv run --no-sync ruff format --check .
    eslint:
      root: "client/"
      run: |
        if [ -z "${CI:-}" ]; then
          exit 0
        fi
        pnpm exec eslint --no-warn-ignored --cache .
    prettier:
      root: "client/"
      run: |
        if [ -z "${CI:-}" ]; then
          exit 0
        fi
        scoped_files="$(rg --files .circleci client docs docs-tooling server \
          -g '*.md' -g '*.js' -g '*.mjs' -g '*.cjs' -g '*.json' -g '*.yml' -g '*.yaml')"
        root_files="$(rg --files \
          -g '*.md' -g '*.js' -g '*.mjs' -g '*.cjs' -g '*.json' -g '*.yml' -g '*.yaml' \
          | rg -v '/')"
        files="$(printf '%s\n%s\n' "$scoped_files" "$root_files" \
          | rg -v '^$|^docs/(reference/api/|public/api/|[.]generated/)|(^|/)(AGENT[.]md|AGENTS[.]md|pnpm-lock[.]yaml|package-lock[.]json|uv[.]lock)$|[.]min[.]js$')"
        if [ -n "$files" ]; then
          files="$(printf '%s\n' "$files" | sed 's|^|../|')"
          cd client
          pnpm exec prettier --check $files
        fi
    md-toc:
      run: |
        if [ -z "${CI:-}" ]; then
          exit 0
        fi
        files="$(rg --files -g '*.md' server client | rg -v '/AGENT\\.md$|/AGENTS\\.md$')"
        if [ -n "$files" ]; then
          uv run --no-sync python -m md_toc -p github $files
        fi
    # Local staged-file fixes (fast feedback, restaged automatically).
    fix-server:
      stage_fixed: true
      root: "server/"
      glob: "server/*.py"
      run: |
        files="$(git diff --name-only --cached -- 'server/**' | rg '\\.py$')"
        if [ -n "$files" ]; then
          files="$(printf '%s\n' "$files" | sed 's|^server/||')"
          cd server
          uv run --no-sync ruff check --fix --show-fixes $files
          uv run --no-sync ruff format $files
        fi
    fix-client-eslint:
      stage_fixed: true
      run: |
        files="$(git diff --name-only --cached -- 'client/**' | rg '\\.(vue|js|cjs|mjs|ts|jsx|tsx)$')"
        if [ -n "$files" ]; then
          files="$(printf '%s\n' "$files" | sed 's|^client/||')"
          pnpm -C client exec eslint --no-warn-ignored --cache --fix $files
        fi
    fix-client-prettier:
      stage_fixed: true
      run: |
        files="$(git diff --name-only --cached --diff-filter=d \
          | rg '^([.]circleci/|client/|docs/|docs-tooling/|server/|[^/]+$)' \
          | rg '[.](js|mjs|cjs|json|md|yml|yaml)$' \
          | rg -v '^docs/(reference/api/|public/api/|[.]generated/)|(^|/)(AGENT[.]md|AGENTS[.]md|pnpm-lock[.]yaml|package-lock[.]json|uv[.]lock)$|[.]min[.]js$')"
        if [ -n "$files" ]; then
          files="$(printf '%s\n' "$files" | sed 's|^|../|')"
          cd client
          pnpm exec prettier --write $files
        fi
    fix-md-toc:
      stage_fixed: true
      run: |
        files="$(git diff --name-only --cached --diff-filter=d -- '*.md' | rg -v '/AGENT\\.md$|/AGENTS\\.md$')"
        if [ -n "$files" ]; then
          uv run --no-sync python -m md_toc -p github $files
        fi
    # CircleCI config validation (runs locally if the CLI is installed).
    circleci-config:
      run: |
        readarray -t files < <(git diff --name-only --cached -- '.circleci/*.yml')
        if [ "${#files[@]}" -eq 0 ]; then
          exit 0
        fi
        if ! command -v circleci >/dev/null 2>&1; then
          echo "circleci CLI not found; skipping config validation."
          exit 0
        fi
        for file in "${files[@]}"; do
          circleci config validate -c "$file"
        done
