commit-msg:
  commands:
    commitlint:
      run: pnpm -C . exec commitlint --edit "$1"

pre-commit:
  parallel: false
  commands:
    ruff-check:
      run: |
        if [ -z "${CI:-}" ]; then
          exit 0
        fi
        cd server
        uv run --no-sync ruff check .
    ruff-format:
      run: |
        if [ -z "${CI:-}" ]; then
          exit 0
        fi
        cd server
        uv run --no-sync ruff format --check .
    eslint:
      run: |
        if [ -z "${CI:-}" ]; then
          exit 0
        fi
        pnpm -C client exec eslint --no-warn-ignored --cache .
    prettier:
      run: |
        if [ -z "${CI:-}" ]; then
          exit 0
        fi
        pnpm -C client exec prettier --check .
    doctoc:
      run: |
        if [ -z "${CI:-}" ]; then
          exit 0
        fi
        files="$(rg --files -g '*.md' server client | rg -v '/AGENT\.md$|/AGENTS\\.md$')"
        if [ -n "$files" ]; then
          pnpm -C client exec doctoc --github -u --notitle $files
        fi
    fix-server:
      stage_fixed: true
      run: |
        files="$(git diff --name-only --cached -- 'server/**' | rg '\.py$')"
        if [ -n "$files" ]; then
          files="$(printf '%s\n' "$files" | sed 's|^server/||')"
          cd server
          uv run --no-sync ruff check --fix --show-fixes $files
          uv run --no-sync ruff format $files
        fi
    fix-client-eslint:
      stage_fixed: true
      run: |
        files="$(git diff --name-only --cached -- 'client/**' | rg '\.(vue|js|cjs|mjs|ts|jsx|tsx)$')"
        if [ -n "$files" ]; then
          files="$(printf '%s\n' "$files" | sed 's|^client/||')"
          pnpm -C client exec eslint --no-warn-ignored --cache --fix $files
        fi
    fix-client-prettier:
      stage_fixed: true
      run: |
        files="$(git diff --name-only --cached -- 'client/**' | rg '\.(less|scss|css|vue|markdown|json|md|yml|yaml|html)$')"
        if [ -n "$files" ]; then
          files="$(printf '%s\n' "$files" | sed 's|^client/||')"
          pnpm -C client exec prettier --write $files
        fi
    fix-doctoc:
      stage_fixed: true
      run: |
        files="$(git diff --name-only --cached -- 'client/**' | rg '\.md$' | rg -v '/AGENT\.md$|/AGENTS\.md$')"
        if [ -n "$files" ]; then
          files="$(printf '%s\n' "$files" | sed 's|^client/||')"
          pnpm -C client exec doctoc --github -u --notitle $files
        fi
    circleci-config:
      run: |
        readarray -t files < <(git diff --name-only --cached -- '.circleci/*.yml')
        for file in ${files[@]}; do
            circleci config validate ${file}
        done
