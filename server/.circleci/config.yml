version: 2.1
orbs:
    github: arrai/github@5.0.0
    lintinator: arrai/lintinator@2.1.0
    pypi: arrai/pypi@3.1.0
    pytest: arrai/pytest@9.1.1
    pip-audit: arrai/pip-audit@1.0.3
    utils: arrai/utils@1.21.1
executors:
    base:
        docker:
            - image: cimg/base:current
    python311:
        docker:
            - image: cimg/python:3.11
            - image: cimg/postgres:15.12
            - image: cimg/redis:6.2
    python311-base:
        docker:
            - image: cimg/python:3.11
    python311-node:
        docker:
            - image: cimg/python:3.11-node
jobs:
    build:
        executor: python311-base
        resource_class: small
        steps:
            - checkout
            - run:
                  name: Verify Git Tag Matches Python Version
                  command: |
                      GIT_TAG=$(git describe --tags --exact-match 2>/dev/null)

                      if [ $? -ne 0 ]; then
                        echo "No exact match Git tag found."
                        exit 1
                      fi

                      PYTHON_VERSION=$(python -c "import vueda; print(vueda.__version__)")

                      if [ "$GIT_TAG" == "v$PYTHON_VERSION" ]; then
                        echo "Git tag matches the Python version: $GIT_TAG"
                        exit 0
                      else
                        echo "Git tag ($GIT_TAG) does not match the Python version ($PYTHON_VERSION)."
                        exit 1
                      fi
            - run:
                  name: Build Package
                  command: |
                      pip install --user --upgrade build
                      python -m build --wheel
            - save_cache:
                  paths:
                      - ~/project/dist
                  key: build-{{ arch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}
    docs:
        executor: python311-node
        resource_class: medium
        circleci_ip_ranges: true
        steps:
            - checkout
            - utils/add_ssh_config:
                  hostname: tools.arrai.dev
                  host: tools.arrai.dev
            - add_ssh_keys:
                  fingerprints:
                      - "SHA256:e+v8NQ5Y014IPQ28fRUTNgaFyHA8K0stDUFYNcUDTp0"
            - run:
                  name: Install Dependencies
                  command: uv sync --dev --frozen
            - run:
                  name: Copy Configuration
                  command: cp config.circleci.toml config.local.toml
            - run:
                  name: Generate Schema
                  command: uv run python manage.py spectacular --color --file schema.yml
            - run:
                  name: Generate Documentation
                  command: npx -y @redocly/cli build-docs schema.yml
            - run:
                  name: Bundle Documentation
                  command: |
                      rm -rf docs/
                      mkdir -p -m 0750 docs/$CIRCLE_TAG/
                      mv redoc-static.html docs/$CIRCLE_TAG/index.html
            - utils/rsync_folder:
                  when: on_success
                  folder: ~/project/docs/
                  remote_folder: /
                  delete: false
                  host: tools.arrai.dev
    run_pipeline:
        parameters:
            vcs:
                type: enum
                enum: [bitbucket, github]
                default: github
            org:
                type: string
                default: ${CIRCLE_PROJECT_USERNAME}
            project:
                type: string
            token:
                type: string
                default: ${CIRCLECI_API_TOKEN}
        executor: base
        resource_class: small
        steps:
            - run:
                  name: Run Pipeline
                  command: |
                      curl --location \
                           --request POST "https://circleci.com/api/v2/project/<<parameters.vcs>>/<<parameters.org>>/<<parameters.project>>/pipeline" \
                           --header 'Content-Type: application/json' \
                           --user "<<parameters.token>>:"
workflows:
    test:
        jobs:
            - pytest/pytest:
                  name: pytest
                  executor: python311
                  context: arrai-global
                  pytest_args: --cov -n2 --dist loadgroup
                  env_type: uv
                  config:
                      - run:
                            name: Copy config
                            command: cp config.circleci.toml config.local.toml
                  filters: # filters required since `build_*` has filters
                      branches:
                          only: /.*/
                      tags:
                          only: /.*/
            - docs:
                  name: docs
                  context: arrai-global
                  filters:
                      tags:
                          only: /.*/
                      branches:
                          ignore: /.*/
            - build:
                  name: build
                  requires:
                      - pytest
                  filters:
                      tags:
                          only: /.*/
                      branches:
                          ignore: /.*/
            - github/create_release:
                  name: release_on_github
                  context: arrai-global
                  requires:
                      - build
                  filters:
                      tags:
                          only: /.*/
                      branches:
                          ignore: /.*/
            - pypi/upload_release:
                  name: publish
                  context: arrai-private-package-publishing
                  cache_key: build-{{ arch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}
                  requires:
                      - build
                  filters:
                      tags:
                          only: /.*/
                      branches:
                          ignore: /.*/
    lint:
        jobs:
            - lintinator/lint_python_fixed_ip:
                  name: lint
                  context: arrai-global
                  executor: python311-base
                  hooks: ruff
                  filters:
                      branches:
                          only:
                              - main
            - lintinator/lint_python:
                  name: lint-no-badge
                  executor: python311-base
                  hooks: ruff
                  create_badges: false
                  filters:
                      branches:
                          ignore:
                              - main
    audit:
        jobs:
            - pip-audit/pip_audit_ip:
                  name: pip-audit
                  context: arrai-global
                  executor: python311-base
                  env_type: uv
                  filters:
                      branches:
                          only:
                              - main
            - pip-audit/pip_audit:
                  name: pip-audit-no-badge
                  context: arrai-global
                  executor: python311-base
                  env_type: uv
                  create_badges: false
                  filters:
                      branches:
                          ignore:
                              - main
