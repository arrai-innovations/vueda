[build-system]
requires = ["setuptools>=78.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vueda"
description = "Vue.js User Experience for Django Administration (VUEDA) - Server Library"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Arrai Innovations", email = "support@arrai.com" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
]
dynamic = ["version"]
dependencies = [
    "ansicolors>=1.1.8,<2",
    "argparse-color-formatter>=2.0.0.post1,<3",
    "asgi-cors-middleware>=0.0.2,<0.1",
    "channels>=4.2.0,<5",
    "dj-rest-auth>=6.0.0,<7",
    "django-anymail[mailgun,sendgrid,sparkpost]>=15.0,<16",
    "django-allauth[mfa]>=65.14.1",
    "django-cors-headers>=4.9.0,<5",
    "django-extensions>=4.0.0,<5",
    "django-filter>=23.5",
    "django-private-storage>=3.1.1,<4",
    "django-simple-history>=3.11.0,<4",
    "django>=5.2.14,<5.3",
    "dj-database-url>=2.2.0,<3",
    "dj-email-url>=1.0.6,<2",
    "django-cache-url>=3.4.5,<4",
    "djangorestframework>=3.17.1,<4",
    "drf-flex-fields>=1.0.2,<2",
    "drf-writable-nested>=0.7.0,<1",
    "hashids>=1.3.1,<1.4",
    "ordered-set>=4.1.0,<5",
    "pwned-passwords-django>=5.1.0,<6",
    "rest-framework-generic-relations>=2.1.0,<3",
    "sentry-sdk>=2.62.0,<3",
    "swapper>=1.4.0",
    "celery>=5.5.3",
    "django-phonenumber-field[phonenumberslite]>=8.1.0",
    "urllib3>=2.7.0,<3",
    "twilio>=9.8.0",
    "phonenumbers>=9.0.15",
    "starlette>=1.1.0",
]

[project.urls]
repository = "https://github.com/arrai-innovations/vueda-server/"

[project.scripts]
vueda = "vueda.__main__:main"

[dependency-groups]
dev = [
    # test/dev related
    "django_extensions ==4.0.0",
    "django-view-manager ==2.0.0",
    "coverage >=7.14.1",
    "ipdb >=0.13.13",
    "pytest >=7.4.3",
    "pytest-watcher >=0.4.3",
    "pytest-cov >=4.1.0",
    "pytest-django >=4.7.0",
    "pytest-order >=1.2.0",
    "pytest-sugar >=0.9.7",
    "pytest-xdist >=3.8.0",
    "python-dateutil >=2.9.0.post0,<3",
    "gunicorn >=26.0.0",
    "jinja2 >=3.1.6",
    "drf-spectacular >=0.28.0,<0.29",
    "psycopg[binary]>=3.3.3",
]
docs = [
    "pdoc >=14.7.0",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"*" = ["*.css", "*.html", "*.jinja2", "*.js", "*.sql", "*.txt"]

[tool.setuptools.packages.find]
include = ["vueda*"]

[tool.setuptools.dynamic]
version = { attr = "vueda.__version__" }

[tool.coverage.run]
branch = true
parallel = true
concurrency = ["multiprocessing"]
source = ["./vueda"]
omit = [
    "__main__.py",
    "cli.py",
    "update.py",
    "*/migrations/*",
    "*/open_api*",
    "*tests*",
    "*/spectacular_hooks.py",
    "*/schema.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "except ImportError",
    "raise ImportError"
]

[tool.pytest.ini_options]
django_find_project = false
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "--ds=tests.settings --create-db"
testpaths = ["tests"]
python_files = [
    "test_*.py"
]
filterwarnings = [
    "ignore:Passing None for the middleware get_response argument is deprecated:DeprecationWarning",
    "ignore:The providing_args argument is deprecated:DeprecationWarning",
    "ignore:.*You can remove default_app_config:PendingDeprecationWarning",
    "ignore:Model observation with save points is unsupported and will result in unexpected beauvoir."
]

[tool.pysentry.ignore]
while_no_fix = ["PYSEC-2025-183"] # aka CVE-2025-45768; disputed by upstream
