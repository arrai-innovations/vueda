[build-system]
requires = ["setuptools>=78.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vueda"
description = "Vue.js User Experience for Django Administration (VUEDA) - Server Library"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Arrai Innovations", email = "support@arrai.com" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Framework :: Django",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
]
dynamic = ["dependencies", "version"]

[project.urls]
repository = "https://github.com/arrai-innovations/vueda-server/"

[project.scripts]
vueda = "vueda.__main__:main"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [
    # entries from .gitignore are excluded by default
    ".circleci",
    ".git",
    ".github",
]

[tool.ruff.lint]
select = [
    # flake8-builtins: https://docs.astral.sh/ruff/rules/#flake8-builtins-a
    "A",
    # flake8-bugbear: https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
    "B0",
    # flake8-comprehensions: https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
    "C4",
    # mccabe: https://docs.astral.sh/ruff/rules/#mccabe-c90
    "C90",
    # flake8-django: https://docs.astral.sh/ruff/rules/#flake8-django-dj
    "DJ",
    # pycodestyle: https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
    "E",
    "W",
    # pyflakes: https://docs.astral.sh/ruff/rules/#pyflakes-f
    "F",
    # flake8-fixme: https://docs.astral.sh/ruff/rules/#flake8-fixme-fix
    "FIX",
    # flake8-logging-format: https://docs.astral.sh/ruff/rules/#flake8-logging-format-g
    "G",
    # isort: https://docs.astral.sh/ruff/rules/#isort-i
    "I",
    # flake8-no-pep420 https://docs.astral.sh/ruff/rules/#flake8-no-pep420-inp
    "INP",
    # pep8-naming: https://docs.astral.sh/ruff/rules/#pep8-naming-n
    "N",
    # pylint: https://docs.astral.sh/ruff/rules/#pylint-pl
    "PLC",
    "PLE",
    # flake8-quotes: https://docs.astral.sh/ruff/rules/#flake8-quotes-q
    "Q",
    # ruff: https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
    "RUF010",
    "RUF100",
    # flake8-simplify: https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
    "SIM",
    # flake8-debugger: https://docs.astral.sh/ruff/rules/#flake8-debugger-t10
    "T10",
    # flake8-print: https://docs.astral.sh/ruff/rules/#flake8-print-t20
    "T20",
    # flake8-tidy-imports: https://docs.astral.sh/ruff/rules/#flake8-tidy-imports-tid
    "TID",
]
ignore = [
    # pycodestyle: let the reformatter deal with long lines
    "E501",
    # pyflakes: we are already covered by F401, thanks.
    "F811",
    # flake8-fixme: "todo" comments are fine
    "FIX002",
    # ruff: don't care about annotations
    "RUF012",
    # flake8-simplify: try-except-pass is fine
    "SIM105",
    # flake8-simplify: developers are a better judge as to when to use ternaries
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # django-flake8: don't care about missing __str__
    "DJ008",
    # flake8-sim: don't care about code simplification in tests
    "SIM",
    # flake8-print: allow print() in tests
    "T201"
]
"vueda/__main__.py" = [
    # flake8-print: allow print() in scripts
    "T201"
]

[tool.ruff.lint.isort]
known-first-party = [
    "vueda",
    "tests",
]
force-single-line = true
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.flake8-self]
ignore-names = [
    # defaults
    'setUp',
    'tearDown',
    'setUpClass',
    'tearDownClass',
    'setUpTestData',
    'failureException',
    'longMessage',
    'maxDiff',
    # custom (ideally, we'd want "assert*")
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"*" = ["*.css", "*.html", "*.jinja2", "*.js", "*.sql"]

[tool.setuptools.packages.find]
include = ["vueda*"]

[tool.setuptools.dynamic]
dependencies = { file = "requirements.txt" }
version = { attr = "vueda.__version__" }

[tool.coverage.run]
branch = true
parallel = true
concurrency = ["multiprocessing"]
source = ["./vueda"]
omit = [
    "__main__.py",
    "cli.py",
    "update.py",
    "*/migrations/*",
    "*/open_api*",
    "*tests*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "except ImportError",
    "raise ImportError"
]

[tool.pytest.ini_options]
django_find_project = false
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "--ds=tests.settings --create-db"
testpaths = ["tests"]
python_files = [
    "test_*.py"
]
filterwarnings = [
    "ignore:Passing None for the middleware get_response argument is deprecated:DeprecationWarning",
    "ignore:The providing_args argument is deprecated:DeprecationWarning",
    "ignore:.*You can remove default_app_config:PendingDeprecationWarning",
    "ignore:Model observation with save points is unsupported and will result in unexpected beauvoir."
]
