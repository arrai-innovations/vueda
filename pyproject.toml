[tool.uv.workspace]
members = ["server", "docs-tooling"]

[project]
name = "vueda-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["md-toc >=8.2.2", "ruff ==0.15.20", "towncrier >=26.9"]

[tool.uv]
exclude-newer = "1 day"
# The cooldown guards against compromised third-party releases. Our own packages skip it, so a release
# can be adopted the day it publishes.
exclude-newer-package = { django-object-streams = false }
