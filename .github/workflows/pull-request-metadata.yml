name: Pull request metadata

# pull_request_target runs with a token that can write labels, including for
# pull requests from forks. It checks out the base branch, so every script here
# is the base branch's own. Never check out or run code from the pull request.
on:
    pull_request_target:
        types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
    contents: read

concurrency:
    group: pull-request-metadata-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    labels-and-changelog:
        name: Labels and changelog
        runs-on: ubuntu-slim
        permissions:
            contents: read
            pull-requests: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Check labels and changelog fragments
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: python3 scripts/check_pr_metadata.py

    title:
        name: Title
        runs-on: ubuntu-slim
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  version: 11.21.0
                  install: false
            - name: Install locked tooling dependencies
              # Use the base branch's lockfile and never run install scripts.
              run: pnpm --filter vueda-monorepo install --frozen-lockfile --ignore-scripts
            - name: Check the title against commitlint
              env:
                  # Passed through the environment so the title is never parsed as shell.
                  TITLE: ${{ github.event.pull_request.title }}
              run: printf '%s\n' "$TITLE" | pnpm exec commitlint
