packages:
  - client
  - docs
  - docs-tooling
  - server
patchedDependencies:
  vitepress-plugin-diagrams@1.1.2: patches/vitepress-plugin-diagrams.patch
  vitepress@1.6.4: patches/vitepress.patch

overrides:
  lodash-es: ">=4.17.24"
  postcss: ">=8.5.23"
  # Transitive (dev-only) advisory remediations. Each key scopes to the
  # reported vulnerable range; each value floors at the minimal patched version
  # and caps below the next major, so the newest in-major release is pulled in
  # without forcing build/lint/docs/test tooling across a major bump.
  "@isaacs/brace-expansion@<=5.0.0": ">=5.0.1 <6"
  "@protobufjs/utf8@<=1.1.0": ">=1.1.1 <2"
  "ajv@<6.14.0": ">=6.14.0 <7"
  "ajv@>=7.0.0-alpha.0 <8.18.0": ">=8.18.0 <9"
  "brace-expansion@<1.1.18": ">=1.1.18 <2"
  "brace-expansion@>=2.0.0 <2.1.4": ">=2.1.4 <3"
  "brace-expansion@>=3.0.0 <5.0.9": ">=5.0.9 <6"
  "dompurify@<3.4.12": ">=3.4.12 <4"
  # esbuild 0.24.x stopped at 0.24.2; the fix first shipped in 0.25.0.
  "esbuild@<=0.24.2": ">=0.25.0 <0.26"
  "fast-uri@<3.1.5": ">=3.1.5 <4"
  "fast-xml-parser@<5.7.0": ">=5.7.0 <6"
  "flatted@<=3.4.1": ">=3.4.2 <4"
  "form-data@>=4.0.0 <4.0.6": ">=4.0.6 <5"
  "handlebars@<4.7.9": ">=4.7.9 <5"
  "js-cookie@<=3.0.5": ">=3.0.6 <4"
  "js-yaml@>=4.0.0 <4.3.0": ">=4.3.0 <5"
  "linkify-it@<=5.0.1": ">=5.0.2 <6"
  "lodash@<=4.17.23": ">=4.17.24 <5"
  "markdown-it@>=13.0.0 <14.1.1": ">=14.1.1 <15"
  "minimatch@<3.1.4": ">=3.1.4 <4"
  "minimatch@>=5.0.0 <5.1.8": ">=5.1.8 <6"
  "minimatch@>=9.0.0 <9.0.7": ">=9.0.7 <10"
  "minimatch@>=10.0.0 <10.2.3": ">=10.2.3 <11"
  nanoid@<3.3.18: '>=3.3.18 <4'
  "picomatch@<2.3.2": ">=2.3.2 <3"
  "picomatch@>=4.0.0 <4.0.4": ">=4.0.4 <5"
  "protobufjs@<=7.5.7": ">=7.5.8 <8"
  "rollup@>=4.0.0 <4.59.0": ">=4.59.0 <5"
  "shell-quote@>=1.1.0 <=1.8.4": ">=1.8.5 <2"
  "underscore@<=1.13.7": ">=1.13.8 <2"
  "undici@>=6.0.0 <6.28.0": ">=6.28.0 <7"
  "vite@>=6.0.0 <=6.4.2": ">=6.4.3 <7"
  "vitest@<3.2.6": ">=3.2.6 <4"
  "ws@>=7.0.0 <7.5.11": ">=7.5.11 <8"
  "ws@>=8.0.0 <8.20.1": ">=8.20.1 <9"
  "@babel/core@<=7.29.0": ">=7.29.1 <8"
  "yaml@>=1.0.0 <1.10.3": ">=1.10.3 <2"
  "yaml@>=2.0.0 <2.8.3": ">=2.8.3 <3"

auditConfig:
  ignoreGhsas:
    # vite dev-server advisories (dev-only, dev-server-only). The fixes are
    # vite 6.4.2+ and 6.4.3+, but they reach us only through vitepress@1.6.4,
    # which pins vite ^5.4.14 and has no 5.x backport. vite 6/7 support lands in
    # vitepress 2.x, still alpha as of 2026-06. Revisit when vitepress 2 ships
    # stable; until then this never reaches shipped code.
    - GHSA-4w7w-66w2-5vf9
    - GHSA-fx2h-pf6j-xcff
    - GHSA-v6wh-96g9-6wx3

peerDependencyRules:
  allowedVersions:
    glob-promise>glob: "10 || 11"

allowBuilds:
  lefthook: false
  esbuild: true
  msw: true
  unrs-resolver: true
  vue-demi: true
  core-js: false
  protobufjs: false

minimumReleaseAgeExclude:
  - '@arrai-innovations/reactive-helpers@22.0.0'
  - '@arrai-innovations/vue-sonner@2.0.10'
  - '@arrai-innovations/vitepress-theme@1.0.1'
