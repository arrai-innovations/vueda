version: 2.1

orbs:
    pytest: arrai/pytest@11.0.0
    utils: arrai/utils@1.23.3

parameters:
    run-docs-workflows:
        type: boolean
        default: false
    # Set by the setup config when scripts/deploy_docs.py triggers a pipeline.
    # Publishes the documentation site without cutting a docs-v* tag.
    deploy-docs:
        type: boolean
        default: false

executors:
    python311:
        docker:
            - image: cimg/python:3.11
    python311-node:
        docker:
            - image: cimg/python:3.11-node

jobs:
    docs-tooling-test-js:
        parameters:
            create_badges:
                type: boolean
                default: true
        executor: python311-node
        resource_class: medium
        circleci_ip_ranges: true
        steps:
            - checkout
            - utils/add_ssh_config
            - run:
                  name: Ensure pnpm command is available
                  command: |
                      mkdir -p "$HOME/.local/bin"
                      printf '%s\n' '#!/usr/bin/env bash' 'exec corepack pnpm "$@"' > "$HOME/.local/bin/pnpm"
                      chmod +x "$HOME/.local/bin/pnpm"
                      echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
                      export PATH="$HOME/.local/bin:$PATH"
                      pnpm --version
            - utils/add_npm_config:
                  registry: npm.arrai.dev
                  token: $NPM_ARRAI_DEV_TOKEN
                  scopes: |
                      @arrai-innovations:registry=https://npm.arrai.dev/
            - restore_cache:
                  keys:
                      - pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - run:
                  name: Install Node Dependencies
                  command: pnpm install
            - save_cache:
                  paths:
                      - ~/.local/share/pnpm/store
                  key: pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - run:
                  name: Run JS Tests with Coverage
                  command: pnpm -C docs-tooling run coverage
            - utils/rsync_folder:
                  when: always
                  folder: docs-tooling/coverage/
                  remote_folder: ${CIRCLE_BRANCH}/coverage_${CIRCLE_JOB}
                  host: docs
            - when:
                  condition: <<parameters.create_badges>>
                  steps:
                      - utils/make_status_shield:
                            when: on_fail
                            status: errors
                            color: red
                            logo: Node.js
                      - utils/make_status_shield:
                            when: on_success
                            status: passed
                            color: brightgreen
                            logo: Node.js
                      - utils/rsync_file:
                            when: always
                            file: ~/status.svg
                            remote_file: ${CIRCLE_BRANCH}/${CIRCLE_JOB}.svg
                            host: docs
                      - run:
                            name: Create coverage report
                            when: always
                            command: |
                                jq 'if (.total.branches.pct | type) == "number" and (.total.statements.pct | type) == "number" then ((.total.branches.pct + .total.statements.pct) / 2) else 0 end | floor' docs-tooling/coverage/coverage-summary.json > /tmp/.coveragep
                      - utils/make_coverage_shield:
                            when: always
                            link: https://${DOCS_HOST}/${CIRCLE_PROJECT_REPONAME}/artifacts/${CIRCLE_BRANCH}/coverage_${CIRCLE_JOB}/
                      - utils/rsync_file:
                            when: always
                            file: /tmp/coverage.svg
                            remote_file: ${CIRCLE_BRANCH}/${CIRCLE_JOB}.coverage.svg
                            host: docs

    docs-validate:
        executor: python311-node
        resource_class: medium
        circleci_ip_ranges: true
        steps:
            - checkout
            - run:
                  name: Install Python Dependencies
                  command: uv sync --all-groups --all-packages --frozen
            - run:
                  name: Ensure pnpm command is available
                  command: |
                      mkdir -p "$HOME/.local/bin"
                      printf '%s\n' '#!/usr/bin/env bash' 'exec corepack pnpm "$@"' > "$HOME/.local/bin/pnpm"
                      chmod +x "$HOME/.local/bin/pnpm"
                      echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
                      export PATH="$HOME/.local/bin:$PATH"
                      pnpm --version
            - utils/add_npm_config:
                  registry: npm.arrai.dev
                  token: $NPM_ARRAI_DEV_TOKEN
                  scopes: |
                      @arrai-innovations:registry=https://npm.arrai.dev/
            - restore_cache:
                  keys:
                      - pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - run:
                  name: Install Node Dependencies
                  command: pnpm install
            - save_cache:
                  paths:
                      - ~/.local/share/pnpm/store
                  key: pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - run:
                  name: Copy Configuration
                  command: cp server/config.circleci.toml server/config.local.toml
            - run:
                  name: Extract and Normalize API Documentation
                  command: |
                      cd ~/project/docs-tooling && ./bin/docs-tooling.js extract
                      cd ~/project/docs-tooling && ./bin/docs-tooling.js normalize
            - run:
                  name: Render API Documentation
                  command: |
                      mkdir -p docs/reference/api
                      cd ~/project/docs-tooling && ./bin/docs-tooling.js render
            - run:
                  name: Validate Documentation References
                  command: |
                      cd ~/project/docs-tooling && ./bin/docs-tooling.js validate
            - run:
                  name: Validate Theme/CSS Source Conformance
                  command: |
                      cd ~/project/docs-tooling && ./bin/docs-tooling.js validate-sources
    docs-publish:
        executor: python311-node
        resource_class: medium
        circleci_ip_ranges: true
        steps:
            - checkout
            - utils/add_ssh_config:
                  hostname: tools.arrai.dev
                  host: tools.arrai.dev
            - add_ssh_keys:
                  fingerprints:
                      - "SHA256:NfqZXcPtWKzH+WVKDsNH5WGNzaBA30iyp5iYQgXjG0M"
            - run:
                  name: Install Python Dependencies
                  command: uv sync --all-groups --all-packages --frozen
            - run:
                  name: Ensure pnpm command is available
                  command: |
                      mkdir -p "$HOME/.local/bin"
                      printf '%s\n' '#!/usr/bin/env bash' 'exec corepack pnpm "$@"' > "$HOME/.local/bin/pnpm"
                      chmod +x "$HOME/.local/bin/pnpm"
                      echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
                      export PATH="$HOME/.local/bin:$PATH"
                      pnpm --version
            - utils/add_npm_config:
                  registry: npm.arrai.dev
                  token: $NPM_ARRAI_DEV_TOKEN
                  scopes: |
                      @arrai-innovations:registry=https://npm.arrai.dev/
            - restore_cache:
                  keys:
                      - pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - run:
                  name: Install Node Dependencies
                  command: pnpm install
            - save_cache:
                  paths:
                      - ~/.local/share/pnpm/store
                  key: pnpm-v1-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - run:
                  name: Copy Configuration
                  command: cp server/config.circleci.toml server/config.local.toml
            - run:
                  name: Extract API Documentation
                  command: |
                      cd ~/project/docs-tooling && ./bin/docs-tooling.js extract
                      cd ~/project/docs-tooling && ./bin/docs-tooling.js normalize
            - run:
                  name: Render API Documentation
                  command: |
                      mkdir -p docs/reference/api
                      cd ~/project/docs-tooling && ./bin/docs-tooling.js render
            - run:
                  name: Resolve Documentation Major Version
                  command: |
                      # Publish per major line: docs-v3.x.y -> /v3/. Minor, patch, and
                      # prerelease builds overwrite the major directory. An on-demand
                      # deploy carries no tag, so read the client package version.
                      if [ -n "${CIRCLE_TAG:-}" ]; then
                          VERSION="${CIRCLE_TAG#docs-v}"
                      else
                          VERSION="$(node -p "require('./client/package.json').version")"
                      fi
                      MAJOR="${VERSION%%.*}"
                      case "${MAJOR}" in
                          "" | *[!0-9]*)
                              echo "Refusing to publish: '${VERSION}' has no numeric major version."
                              exit 1
                              ;;
                      esac
                      echo "export DOCS_MAJOR=\"${MAJOR}\"" >> "$BASH_ENV"
                      echo "Publishing documentation to /v${MAJOR}/."
            - run:
                  name: Build VitePress Site
                  command: |
                      rm -rf docs/.vitepress/.temp docs/.vitepress/cache
                      cd docs && NODE_OPTIONS=--max-old-space-size=4096 VITEPRESS_BASE="/v${DOCS_MAJOR}/" pnpm exec vitepress build
            - run:
                  name: Stage Documentation for Deploy
                  command: |
                      mkdir -p -m 0750 "publish/v${DOCS_MAJOR}/"
                      cp -r site/* "publish/v${DOCS_MAJOR}/"
            # RETARGET FOR vueda.dev (ops): remote_folder "/" resolves server-side to the
            # SSH user's docroot. For /v<major>/ to serve at the domain root, this must
            # point at the vueda.dev docroot (new vhost + SSH user), not the current
            # docs.arrai.dev/vueda/documentation base. delete:false is required so a new
            # major build does not wipe sibling majors; stale files within a rebuilt major
            # dir are a separate concern (clean the major dir server-side before deploy, or
            # switch to a per-major rsync with --delete).
            - utils/rsync_folder:
                  when: on_success
                  folder: ~/project/publish/
                  remote_folder: /
                  delete: false
                  host: tools.arrai.dev

workflows:
    docs-publish:
        unless: << pipeline.parameters.deploy-docs >>
        jobs:
            - docs-tooling-test-js:
                  name: docs-tooling-test-js
                  context: arrai-global
                  filters:
                      branches:
                          only:
                              - main
            - docs-tooling-test-js:
                  name: docs-tooling-test-js-no-badge
                  context: arrai-global
                  create_badges: false
                  filters:
                      tags:
                          only: /.*/
                      branches:
                          ignore:
                              - main
            - pytest/pytest_fixed_ip:
                  name: docs-tooling-test-py
                  context: arrai-global
                  executor: python311
                  wd: docs-tooling
                  env_type: uv
                  filters:
                      branches:
                          only: /.*/
                      tags:
                          only: /^docs-v.*/
            - docs-validate:
                  name: docs-validate
                  context: arrai-global
            - docs-publish:
                  name: docs-publish
                  context: arrai-global
                  requires:
                      - docs-validate
                      - docs-tooling-test-js-no-badge
                      - docs-tooling-test-py
                  filters:
                      tags:
                          only: /^docs-v.*/
                      branches:
                          ignore: /.*/

    # Triggered through the CircleCI API, not by a tag or a push. Runs on
    # whichever branch the trigger names, so the deploy script guards against
    # publishing a branch other than main by accident.
    docs-deploy:
        when: << pipeline.parameters.deploy-docs >>
        jobs:
            - docs-validate:
                  name: docs-validate
                  context: arrai-global
            - docs-publish:
                  name: docs-publish
                  context: arrai-global
                  requires:
                      - docs-validate
