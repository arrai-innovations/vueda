version: 2.1

orbs:
    github: arrai/github@5.0.0
    lintinator: arrai/lintinator@2.1.1
    pypi: arrai/pypi@3.1.0
    pysentry: arrai/pysentry@1.0.0
    pytest: arrai/pytest@9.1.1
    utils: arrai/utils@1.22.0

parameters:
    run-client-workflows:
        type: boolean
        default: false
    run-server-workflows:
        type: boolean
        default: false

executors:
    python311-pg:
        docker:
            - image: cimg/python:3.11
            - image: cimg/postgres:15.12
    python311-base:
        docker:
            - image: cimg/python:3.11
    python311-node:
        docker:
            - image: cimg/python:3.11-node
    python312-pg:
        docker:
            - image: cimg/python:3.12
            - image: cimg/postgres:15.12

jobs:
    server-build:
        executor: python311-base
        resource_class: small
        steps:
            - checkout
            - run:
                  name: Verify Git Tag Matches Python Version
                  command: |
                      if [[ "$CIRCLE_TAG" != server-v* ]]; then
                        echo "Tag $CIRCLE_TAG is not a server release tag."
                        exit 1
                      fi
                      TAG_VERSION="${CIRCLE_TAG#server-v}"
                      PYTHON_VERSION=$(cd server && python -c "import vueda; print(vueda.__version__)")
                      if [ "$TAG_VERSION" == "$PYTHON_VERSION" ]; then
                        echo "Git tag matches the Python version: $CIRCLE_TAG"
                        exit 0
                      else
                        echo "Git tag ($CIRCLE_TAG) does not match the Python version ($PYTHON_VERSION)."
                        exit 1
                      fi
            - run:
                  name: Build Package
                  command: |
                      rm -rf dist
                      uv build --package vueda --wheel --out-dir dist
            - save_cache:
                  paths:
                      - ~/project/dist
                  key: build-{{ arch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}

workflows:
    server-test:
        jobs:
            - pytest/pytest:
                  name: server-pytest
                  executor: python311-pg
                  context: arrai-global
                  wd: server
                  pytest_args: --cov -n2 --dist loadgroup
                  env_type: uv
                  config:
                      - run:
                            name: Copy config
                            command: |
                                cd server
                                cp config.circleci.toml config.local.toml
                  filters:
                      branches:
                          only: /.*/
                      tags:
                          only: /^server-v.*/
            - pytest/pytest:
                  name: server-pytest-django6
                  executor: python312-pg
                  context: arrai-global
                  wd: server
                  pytest_args: --cov -n2 --dist loadgroup
                  env_type: uv
                  config:
                      - run:
                            name: Copy config
                            command: |
                                cd server
                                cp config.circleci.toml config.local.toml
                  filters:
                      branches:
                          only: /.*/
                      tags:
                          only: /^server-v.*/
            - server-build:
                  name: server-build
                  requires:
                      - server-pytest
                      - server-pytest-django6
                  filters:
                      tags:
                          only: /^server-v.*/
                      branches:
                          ignore: /.*/
            - github/create_release:
                  name: server-release-on-github
                  context: arrai-global
                  requires:
                      - server-build
                  filters:
                      tags:
                          only: /^server-v.*/
                      branches:
                          ignore: /.*/
            - pypi/upload_release:
                  name: server-publish
                  context: arrai-private-package-publishing
                  cache_key: build-{{ arch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}
                  requires:
                      - server-build
                  filters:
                      tags:
                          only: /^server-v.*/
                      branches:
                          ignore: /.*/

    server-lint:
        jobs:
            - lintinator/lint_python_fixed_ip:
                  name: server-lint
                  context: arrai-global
                  executor: lintinator/python311
                  hooks: ruff md-toc
                  hook_manager: lefthook
                  install_deps: true
                  setup:
                      - utils/add_npm_config:
                            registry: npm.arrai.dev
                            token: $NPM_ARRAI_DEV_TOKEN
                            scopes: |
                                @arrai-innovations:registry=https://npm.arrai.dev/
                      - run:
                            name: Install server dev dependencies
                            command: |
                                cd server
                                uv sync --dev --frozen
                      - run:
                            name: Ensure pnpm command is available
                            command: |
                                mkdir -p "$HOME/.local/bin"
                                printf '%s\n' '#!/usr/bin/env bash' 'exec corepack pnpm "$@"' > "$HOME/.local/bin/pnpm"
                                chmod +x "$HOME/.local/bin/pnpm"
                                echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
                                export PATH="$HOME/.local/bin:$PATH"
                                pnpm --version
                  filters:
                      branches:
                          only:
                              - main
            - lintinator/lint_python:
                  name: server-lint-no-badge
                  context: arrai-global
                  executor: lintinator/python311
                  hooks: ruff md-toc
                  hook_manager: lefthook
                  create_badges: false
                  install_deps: true
                  setup:
                      - utils/add_npm_config:
                            registry: npm.arrai.dev
                            token: $NPM_ARRAI_DEV_TOKEN
                            scopes: |
                                @arrai-innovations:registry=https://npm.arrai.dev/
                      - run:
                            name: Install server dev dependencies
                            command: |
                                cd server
                                uv sync --dev --frozen
                      - run:
                            name: Ensure pnpm command is available
                            command: |
                                mkdir -p "$HOME/.local/bin"
                                printf '%s\n' '#!/usr/bin/env bash' 'exec corepack pnpm "$@"' > "$HOME/.local/bin/pnpm"
                                chmod +x "$HOME/.local/bin/pnpm"
                                echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
                                export PATH="$HOME/.local/bin:$PATH"
                                pnpm --version
                  filters:
                      branches:
                          ignore:
                              - main

    server-audit:
        jobs:
            - pysentry/pysentry_ip:
                  name: server-pysentry
                  context: arrai-global
                  executor: python311-base
                  version: 0.4.5
                  filters:
                      branches:
                          only:
                              - main
            - pysentry/pysentry:
                  name: server-pysentry-no-badge
                  context: arrai-global
                  executor: python311-base
                  version: 0.4.5
                  create_badges: false
                  filters:
                      branches:
                          ignore:
                              - main
