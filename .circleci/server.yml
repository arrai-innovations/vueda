version: 2.1

orbs:
    github: arrai/github@5.0.0
    lintinator: arrai/lintinator@2.1.1
    pypi: arrai/pypi@3.1.0
    pysentry: arrai/pysentry@1.0.0
    pytest: arrai/pytest@11.0.0
    utils: arrai/utils@1.23.3

parameters:
    run-client-workflows:
        type: boolean
        default: false
    run-server-workflows:
        type: boolean
        default: false

executors:
    base:
        docker:
            - image: cimg/base:current
    python311-pg:
        docker:
            - image: cimg/python:3.11
            - image: cimg/postgres:15.12
    python311-base:
        docker:
            - image: cimg/python:3.11
    python311-node:
        docker:
            - image: cimg/python:3.11-node
    python312-pg:
        docker:
            - image: cimg/python:3.12
            - image: cimg/postgres:15.12
    python313-pg:
        docker:
            - image: cimg/python:3.13
            - image: cimg/postgres:15.12
    python314-pg:
        docker:
            - image: cimg/python:3.14
            - image: cimg/postgres:15.12

jobs:
    server-build:
        executor: python311-base
        resource_class: small
        steps:
            - checkout
            - run:
                  name: Verify Git Tag Matches Python Version
                  command: |
                      if [[ "$CIRCLE_TAG" != server-v* ]]; then
                        echo "Tag $CIRCLE_TAG is not a server release tag."
                        exit 1
                      fi
                      TAG_VERSION="${CIRCLE_TAG#server-v}"
                      PYTHON_VERSION=$(cd server && python -c "import vueda; print(vueda.__version__)")
                      if [ "$TAG_VERSION" == "$PYTHON_VERSION" ]; then
                        echo "Git tag matches the Python version: $CIRCLE_TAG"
                        exit 0
                      else
                        echo "Git tag ($CIRCLE_TAG) does not match the Python version ($PYTHON_VERSION)."
                        exit 1
                      fi
            - run:
                  name: Build Package
                  command: |
                      rm -rf dist
                      uv build --package vueda --wheel --out-dir dist
            - save_cache:
                  paths:
                      - ~/project/dist
                  key: build-{{ arch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}

    server-pytest-status:
        parameters:
            status:
                description: "Status text to put on the shield."
                type: enum
                enum: [passed, failed]
            color:
                description: "Color of the shield."
                type: enum
                enum: [brightgreen, red]
        executor: base
        resource_class: small
        circleci_ip_ranges: true
        steps:
            - utils/add_ssh_config
            - utils/make_status_shield:
                  status: <<parameters.status>>
                  color: <<parameters.color>>
                  label: server-pytest
                  file: ~/status.svg
            - utils/rsync_file:
                  file: ~/status.svg
                  remote_file: ${CIRCLE_BRANCH}/server-pytest.svg
                  host: docs

workflows:
    server-test:
        jobs:
            - pytest/pytest:
                  name: server-pytest-django52-py311
                  executor: python311-pg
                  context: arrai-global
                  wd: server
                  pytest_args: -n2 --dist loadgroup
                  create_status_badge: false
                  create_coverage_badge: false
                  build_coverage: false
                  config:
                      - run:
                            name: Copy config
                            command: |
                                cd server
                                cp config.circleci.toml config.local.toml
                  filters:
                      branches:
                          only: /.*/
                      tags:
                          only: /^server-v.*/
            - pytest/pytest:
                  name: server-pytest-django60-py312
                  executor: python312-pg
                  context: arrai-global
                  wd: server
                  pytest_args: -n2 --dist loadgroup
                  create_status_badge: false
                  create_coverage_badge: false
                  build_coverage: false
                  config:
                      - run:
                            name: Pin Django 6.0
                            command: |
                                cd server
                                uv pip install "django>=6.0,<6.1"
                      - run:
                            name: Copy config
                            command: |
                                cd server
                                cp config.circleci.toml config.local.toml
                  filters:
                      branches:
                          only: /.*/
                      tags:
                          only: /^server-v.*/
            - pytest/pytest:
                  name: server-pytest-django60-py313
                  executor: python313-pg
                  context: arrai-global
                  wd: server
                  pytest_args: -n2 --dist loadgroup
                  create_status_badge: false
                  create_coverage_badge: false
                  build_coverage: false
                  config:
                      - run:
                            name: Pin Django 6.0
                            command: |
                                cd server
                                uv pip install "django>=6.0,<6.1"
                      - run:
                            name: Copy config
                            command: |
                                cd server
                                cp config.circleci.toml config.local.toml
                  filters:
                      branches:
                          only: /.*/
                      tags:
                          only: /^server-v.*/
            - pytest/pytest:
                  name: server-pytest-django60-py314
                  executor: python314-pg
                  context: arrai-global
                  wd: server
                  pytest_args: -n2 --dist loadgroup
                  create_status_badge: false
                  create_coverage_badge: false
                  build_coverage: false
                  config:
                      - run:
                            name: Pin Django 6.0
                            command: |
                                cd server
                                uv pip install "django>=6.0,<6.1"
                      - run:
                            name: Copy config
                            command: |
                                cd server
                                cp config.circleci.toml config.local.toml
                  filters:
                      branches:
                          only: /.*/
                      tags:
                          only: /^server-v.*/
            - pytest/pytest:
                  name: server-pytest-django61-py312
                  executor: python312-pg
                  context: arrai-global
                  wd: server
                  pytest_args: -n2 --dist loadgroup
                  create_status_badge: false
                  create_coverage_badge: false
                  build_coverage: false
                  config:
                      - run:
                            name: Pin Django 6.1
                            command: |
                                cd server
                                uv pip install "django>=6.1,<6.2"
                      - run:
                            name: Copy config
                            command: |
                                cd server
                                cp config.circleci.toml config.local.toml
                  filters:
                      branches:
                          only: /.*/
                      tags:
                          only: /^server-v.*/
            - pytest/pytest:
                  name: server-pytest-django61-py313
                  executor: python313-pg
                  context: arrai-global
                  wd: server
                  pytest_args: -n2 --dist loadgroup
                  create_status_badge: false
                  create_coverage_badge: false
                  build_coverage: false
                  config:
                      - run:
                            name: Pin Django 6.1
                            command: |
                                cd server
                                uv pip install "django>=6.1,<6.2"
                      - run:
                            name: Copy config
                            command: |
                                cd server
                                cp config.circleci.toml config.local.toml
                  filters:
                      branches:
                          only: /.*/
                      tags:
                          only: /^server-v.*/
            - pytest/pytest_fixed_ip:
                  name: server-pytest-django61-py314
                  executor: python314-pg
                  context: arrai-global
                  wd: server
                  pytest_args: --cov -n2 --dist loadgroup
                  create_status_badge: false
                  coverage_artifacts_directory: server-pytest
                  coverage_badge_label: server-coverage
                  coverage_badge_file: server-coverage.svg
                  config:
                      - run:
                            name: Pin Django 6.1
                            command: |
                                cd server
                                uv pip install "django>=6.1,<6.2"
                      - run:
                            name: Copy config
                            command: |
                                cd server
                                cp config.circleci.toml config.local.toml
                  filters:
                      branches:
                          only: main
                      tags:
                          only: /^server-v.*/
            - pytest/pytest_fixed_ip:
                  name: server-pytest-django61-py314-no-badge
                  executor: python314-pg
                  context: arrai-global
                  wd: server
                  pytest_args: --cov -n2 --dist loadgroup
                  create_status_badge: false
                  create_coverage_badge: false
                  coverage_artifacts_directory: server-pytest
                  config:
                      - run:
                            name: Pin Django 6.1
                            command: |
                                cd server
                                uv pip install "django>=6.1,<6.2"
                      - run:
                            name: Copy config
                            command: |
                                cd server
                                cp config.circleci.toml config.local.toml
                  filters:
                      branches:
                          ignore: main
            - server-pytest-status:
                  # Written immediately, before the matrix even starts, so the badge
                  # defaults to red. If any pytest job fails, server-pytest-status-passed
                  # below never runs, and this stays the last word on the badge.
                  name: server-pytest-status-pending
                  status: failed
                  color: red
                  context: arrai-global
                  filters:
                      branches:
                          only: main
            - server-pytest-status:
                  name: server-pytest-status-passed
                  status: passed
                  color: brightgreen
                  context: arrai-global
                  requires:
                      - server-pytest-status-pending
                      - server-pytest-django52-py311
                      - server-pytest-django60-py312
                      - server-pytest-django60-py313
                      - server-pytest-django60-py314
                      - server-pytest-django61-py312
                      - server-pytest-django61-py313
                      - server-pytest-django61-py314
                  filters:
                      branches:
                          only: main
            - server-build:
                  name: server-build
                  requires:
                      - server-pytest-django52-py311
                      - server-pytest-django60-py312
                      - server-pytest-django60-py313
                      - server-pytest-django60-py314
                      - server-pytest-django61-py312
                      - server-pytest-django61-py313
                      - server-pytest-django61-py314
                  filters:
                      tags:
                          only: /^server-v.*/
                      branches:
                          ignore: /.*/
            - github/create_release:
                  name: server-release-on-github
                  context: arrai-global
                  requires:
                      - server-build
                  filters:
                      tags:
                          only: /^server-v.*/
                      branches:
                          ignore: /.*/
            - pypi/upload_release:
                  name: server-publish
                  context: arrai-private-package-publishing
                  cache_key: build-{{ arch }}-{{ .Environment.CIRCLE_WORKFLOW_ID }}
                  requires:
                      - server-build
                  filters:
                      tags:
                          only: /^server-v.*/
                      branches:
                          ignore: /.*/

    server-lint:
        jobs:
            - lintinator/lint_python_fixed_ip:
                  name: server-lint
                  context: arrai-global
                  executor: lintinator/python311
                  hooks: ruff md-toc
                  hook_manager: lefthook
                  install_deps: true
                  setup:
                      - utils/add_npm_config:
                            registry: npm.arrai.dev
                            token: $NPM_ARRAI_DEV_TOKEN
                            scopes: |
                                @arrai-innovations:registry=https://npm.arrai.dev/
                      - run:
                            name: Install server dev dependencies
                            command: |
                                cd server
                                uv sync --dev --frozen
                      - run:
                            name: Ensure pnpm command is available
                            command: |
                                mkdir -p "$HOME/.local/bin"
                                printf '%s\n' '#!/usr/bin/env bash' 'exec corepack pnpm "$@"' > "$HOME/.local/bin/pnpm"
                                chmod +x "$HOME/.local/bin/pnpm"
                                echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
                                export PATH="$HOME/.local/bin:$PATH"
                                pnpm --version
                  filters:
                      branches:
                          only:
                              - main
            - lintinator/lint_python:
                  name: server-lint-no-badge
                  context: arrai-global
                  executor: lintinator/python311
                  hooks: ruff md-toc
                  hook_manager: lefthook
                  create_badges: false
                  install_deps: true
                  setup:
                      - utils/add_npm_config:
                            registry: npm.arrai.dev
                            token: $NPM_ARRAI_DEV_TOKEN
                            scopes: |
                                @arrai-innovations:registry=https://npm.arrai.dev/
                      - run:
                            name: Install server dev dependencies
                            command: |
                                cd server
                                uv sync --dev --frozen
                      - run:
                            name: Ensure pnpm command is available
                            command: |
                                mkdir -p "$HOME/.local/bin"
                                printf '%s\n' '#!/usr/bin/env bash' 'exec corepack pnpm "$@"' > "$HOME/.local/bin/pnpm"
                                chmod +x "$HOME/.local/bin/pnpm"
                                echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
                                export PATH="$HOME/.local/bin:$PATH"
                                pnpm --version
                  filters:
                      branches:
                          ignore:
                              - main

    server-audit:
        jobs:
            - pysentry/pysentry_ip:
                  name: server-pysentry
                  context: arrai-global
                  executor: python311-base
                  version: 0.4.9
                  filters:
                      branches:
                          only:
                              - main
            - pysentry/pysentry:
                  name: server-pysentry-no-badge
                  context: arrai-global
                  executor: python311-base
                  version: 0.4.9
                  create_badges: false
                  filters:
                      branches:
                          ignore:
                              - main
