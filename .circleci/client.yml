version: 2.1

orbs:
    github: arrai/github@dev:prerelease-pattern
    lintinator: arrai/lintinator@2.1.1
    pnpm: arrai/pnpm@1.0.0
    utils: arrai/utils@1.23.3

parameters:
    run-client-workflows:
        type: boolean
        default: false
    run-server-workflows:
        type: boolean
        default: false

executors:
    node-lts:
        docker:
            - image: cimg/node:lts

jobs:
    client-verify-release-version:
        executor: node-lts
        resource_class: small
        steps:
            - checkout
            - run:
                  name: Check that the tag version matches the release.
                  command: |
                      if [[ "$CIRCLE_TAG" != client-v* ]]; then
                        echo "Tag $CIRCLE_TAG is not a client release tag."
                        exit 1
                      fi
                      PACKAGE_VERSION=$(jq -r '.version' client/package.json)
                      TAG_VERSION="${CIRCLE_TAG#client-v}"
                      if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
                        echo "Git tag ($CIRCLE_TAG) does not match the package version (v$PACKAGE_VERSION)"
                        exit 1
                      fi

    client-test:
        parameters:
            create_badges:
                type: boolean
                default: true
        executor: node-lts
        resource_class: medium+
        circleci_ip_ranges: true
        steps:
            - checkout
            - utils/add_ssh_config
            - utils/add_npm_config:
                  registry: npm.arrai.dev
                  token: $NPM_ARRAI_DEV_TOKEN
                  scopes: |
                      @arrai-innovations:registry=https://npm.arrai.dev/
            - run:
                  name: Install Dependencies
                  command: pnpm install
            - run:
                  name: Run Tests with Coverage
                  command: pnpm -C client run coverage
            # Only the main run publishes. Every other run still executes the
            # suite under coverage, so a break in instrumentation surfaces on
            # the branch that causes it.
            - when:
                  condition: <<parameters.create_badges>>
                  steps:
                      - utils/rsync_folder:
                            when: always
                            folder: client/coverage/
                            remote_folder: ${CIRCLE_BRANCH}/coverage_${CIRCLE_JOB}
                            host: docs
                      - utils/make_status_shield:
                            when: on_fail
                            status: errors
                            color: red
                            logo: Vue.js
                      - utils/make_status_shield:
                            when: on_success
                            status: passed
                            color: brightgreen
                            logo: Vue.js
                      - utils/rsync_file:
                            when: always
                            file: ~/status.svg
                            remote_file: ${CIRCLE_BRANCH}/${CIRCLE_JOB}.svg
                            host: docs
                      - run:
                            name: Create coverage report
                            when: always
                            command: |
                                jq 'if (.total.branches.pct | type) == "number" and (.total.statements.pct | type) == "number" then ((.total.branches.pct + .total.statements.pct) / 2) else 0 end | floor' client/coverage/coverage-summary.json > /tmp/.coveragep
                      - utils/make_coverage_shield:
                            when: always
                            link: https://vueda.dev/artifacts/${CIRCLE_BRANCH}/coverage_${CIRCLE_JOB}/
                      - utils/rsync_file:
                            when: always
                            file: /tmp/coverage.svg
                            remote_file: ${CIRCLE_BRANCH}/${CIRCLE_JOB}.coverage.svg
                            host: docs

    client-publish:
        executor: node-lts
        resource_class: small
        steps:
            - checkout
            - run:
                  name: Install Dependencies from Public npm
                  command: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/
            - run:
                  name: Publish to Public npm with OIDC
                  command: |
                      cd client
                      PACKAGE_VERSION=$(jq -r '.version' package.json)
                      case "$PACKAGE_VERSION" in
                        *-alpha.*) PUBLISH_TAG=alpha ;;
                        *-beta.*) PUBLISH_TAG=beta ;;
                        *-rc.*) PUBLISH_TAG=next ;;
                        *-*) echo "Unsupported prerelease channel: $PACKAGE_VERSION"; exit 1 ;;
                        *) PUBLISH_TAG=latest ;;
                      esac
                      NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
                      export NPM_ID_TOKEN
                      # npm 11 supports the CircleCI OIDC token exchange.
                      npx --yes --registry=https://registry.npmjs.org/ --package=npm@11 npm publish \
                        --registry=https://registry.npmjs.org/ --access public --tag "$PUBLISH_TAG"

workflows:
    client-test:
        jobs:
            - client-test:
                  name: client-test
                  context:
                      - arrai-global
                  filters:
                      branches:
                          only:
                              - main
            - client-test:
                  name: client-test-no-badge
                  context:
                      - arrai-global
                  create_badges: false
                  filters:
                      branches:
                          ignore:
                              - main
                      tags:
                          only: /^client-v.*/
            - client-verify-release-version:
                  name: client-verify-release-version
                  filters:
                      tags:
                          only: /^client-v.*/
                      branches:
                          ignore: /.*/
            - client-publish:
                  name: client-publish
                  context: arrai-global
                  requires:
                      - client-test-no-badge
                      - client-verify-release-version
                  filters:
                      tags:
                          only: /^client-v.*/
                      branches:
                          ignore: /.*/
            - github/create_release:
                  name: client-release-on-github
                  context: arrai-global
                  prerelease_pattern: '-(alpha|beta|rc)\.'
                  requires:
                      - client-publish
                  filters:
                      tags:
                          only: /^client-v.*/
                      branches:
                          ignore: /.*/

    client-lint:
        jobs:
            - lintinator/lint_python_fixed_ip:
                  name: client-lint
                  context: arrai-global
                  executor: lintinator/python311
                  hooks: prettier eslint md-toc
                  hook_manager: lefthook
                  install_deps: true
                  setup:
                      - utils/add_npm_config:
                            registry: npm.arrai.dev
                            token: $NPM_ARRAI_DEV_TOKEN
                            scopes: |
                                @arrai-innovations:registry=https://npm.arrai.dev/
                      - run:
                            name: Ensure pnpm command is available
                            command: |
                                mkdir -p "$HOME/.local/bin"
                                printf '%s\n' '#!/usr/bin/env bash' 'exec corepack pnpm "$@"' > "$HOME/.local/bin/pnpm"
                                chmod +x "$HOME/.local/bin/pnpm"
                                echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
                                export PATH="$HOME/.local/bin:$PATH"
                                pnpm --version
                  filters:
                      branches:
                          only:
                              - main
            - lintinator/lint_python:
                  name: client-lint-no-badge
                  context: arrai-global
                  executor: lintinator/python311
                  hooks: prettier eslint md-toc
                  hook_manager: lefthook
                  create_badges: false
                  install_deps: true
                  setup:
                      - utils/add_npm_config:
                            registry: npm.arrai.dev
                            token: $NPM_ARRAI_DEV_TOKEN
                            scopes: |
                                @arrai-innovations:registry=https://npm.arrai.dev/
                      - run:
                            name: Ensure pnpm command is available
                            command: |
                                mkdir -p "$HOME/.local/bin"
                                printf '%s\n' '#!/usr/bin/env bash' 'exec corepack pnpm "$@"' > "$HOME/.local/bin/pnpm"
                                chmod +x "$HOME/.local/bin/pnpm"
                                echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
                                export PATH="$HOME/.local/bin:$PATH"
                                pnpm --version
                  filters:
                      branches:
                          ignore:
                              - main

    client-audit:
        jobs:
            - pnpm/audit_fixed_ip:
                  name: client-pnpm-audit
                  context: arrai-global
                  executor: pnpm/lts
                  config:
                      - utils/add_npm_config:
                            registry: npm.arrai.dev
                            token: $NPM_ARRAI_DEV_TOKEN
                            scopes: |
                                @arrai-innovations:registry=https://npm.arrai.dev/
                  filters:
                      branches:
                          only:
                              - main
            - pnpm/audit:
                  name: client-pnpm-audit-no-badge
                  context: arrai-global
                  executor: pnpm/lts
                  create_badges: false
                  config:
                      - utils/add_npm_config:
                            registry: npm.arrai.dev
                            token: $NPM_ARRAI_DEV_TOKEN
                            scopes: |
                                @arrai-innovations:registry=https://npm.arrai.dev/
                  filters:
                      branches:
                          ignore:
                              - main
