version: 2.1

setup: true

orbs:
    continuation: circleci/continuation@1.0.0
    path-filtering: circleci/path-filtering@3.0.0

parameters:
    # Set through the CircleCI API by scripts/deploy_docs.py, to publish the
    # documentation site without cutting a docs-v* tag.
    deploy-docs:
        type: boolean
        default: false

jobs:
    # Runs on every branch build, whatever paths changed, so it lives here rather
    # than in a path-filtered continuation config. See scripts/check_changelog_fragments.py.
    changelog-fragments:
        docker:
            - image: cimg/python:3.11
        resource_class: small
        steps:
            - checkout
            - run:
                  name: Install towncrier
                  command: |
                      command -v uv || pip install --quiet uv
                      uv sync --only-group dev --frozen
            - run:
                  name: Require a changelog fragment or the changelog:none label
                  command: uv run --no-sync python scripts/check_changelog_fragments.py

workflows:
    changelog-fragments:
        unless: << pipeline.parameters.deploy-docs >>
        jobs:
            # GITHUB_TOKEN comes from the context and reads the pull request's labels.
            - changelog-fragments:
                  context: arrai-global
                  filters:
                      branches:
                          ignore: main
    docs-publish-on-tag:
        jobs:
            - continuation/continue:
                  name: docs-publish-on-tag
                  configuration_path: .circleci/docs.yml
                  parameters: '{"run-docs-workflows": true}'
                  filters:
                      tags:
                          only: /^docs-v.*/
                      branches:
                          ignore: /.*/
    docs-deploy-on-demand:
        when: << pipeline.parameters.deploy-docs >>
        jobs:
            # deploy-docs is set on the pipeline by the API trigger, and a
            # trigger-time parameter already reaches the continuation config.
            # Passing it here as well fails the continue step with
            # "Conflicting pipeline parameters."
            - continuation/continue:
                  name: docs-deploy-on-demand
                  configuration_path: .circleci/docs.yml
                  parameters: '{"run-docs-workflows": true}'
    client-publish-on-tag:
        jobs:
            - continuation/continue:
                  name: client-publish-on-tag
                  configuration_path: .circleci/client.yml
                  parameters: '{"run-client-workflows": true}'
                  filters:
                      tags:
                          only: /^client-v.*/
                      branches:
                          ignore: /.*/
    server-publish-on-tag:
        jobs:
            - continuation/continue:
                  name: server-publish-on-tag
                  configuration_path: .circleci/server.yml
                  parameters: '{"run-server-workflows": true}'
                  filters:
                      tags:
                          only: /^server-v.*/
                      branches:
                          ignore: /.*/
    detect-code-changes:
        unless: << pipeline.parameters.deploy-docs >>
        jobs:
            - path-filtering/filter:
                  name: detect-code-changes
                  mapping: |
                      client/.* run-client-workflows true .circleci/client.yml
                      server/.* run-server-workflows true .circleci/server.yml
                      docs/.* run-docs-workflows true .circleci/docs.yml
                      docs-tooling/.* run-docs-workflows true .circleci/docs.yml
                      client/.* run-docs-workflows true .circleci/docs.yml
                      server/.* run-docs-workflows true .circleci/docs.yml
                      uv\.lock$ run-server-workflows true .circleci/server.yml
                      uv\.lock$ run-docs-workflows true .circleci/docs.yml
                      pnpm-lock\.yaml$ run-client-workflows true .circleci/client.yml
                      pnpm-lock\.yaml$ run-server-workflows true .circleci/server.yml
                      pnpm-lock\.yaml$ run-docs-workflows true .circleci/docs.yml
                      pyproject\.toml$ run-server-workflows true .circleci/server.yml
                      pyproject\.toml$ run-docs-workflows true .circleci/docs.yml
                      package\.json$ run-client-workflows true .circleci/client.yml
                      package\.json$ run-server-workflows true .circleci/server.yml
                      package\.json$ run-docs-workflows true .circleci/docs.yml
                      pnpm-workspace\.yaml$ run-client-workflows true .circleci/client.yml
                      pnpm-workspace\.yaml$ run-server-workflows true .circleci/server.yml
                      pnpm-workspace\.yaml$ run-docs-workflows true .circleci/docs.yml
                      templates/.*/client/.* run-client-workflows true .circleci/client.yml
                      templates/.*/server/.* run-server-workflows true .circleci/server.yml
                      templates/.*/copier\.yml run-client-workflows true .circleci/client.yml
                      templates/.*/copier\.yml run-server-workflows true .circleci/server.yml
                      templates/.*/(README\.md|package\.json\.jinja|pnpm-workspace\.yaml\.jinja|lefthook\.yml|pyproject\.toml\.jinja) run-client-workflows true .circleci/client.yml
                      templates/.*/(README\.md|package\.json\.jinja|pnpm-workspace\.yaml\.jinja|lefthook\.yml|pyproject\.toml\.jinja) run-server-workflows true .circleci/server.yml
                  base-revision: main
                  config-path: .circleci/no-changes.yml
                  filters:
                      tags:
                          ignore:
                              - /^docs-v.*/
                              - /^client-v.*/
                              - /^server-v.*/
