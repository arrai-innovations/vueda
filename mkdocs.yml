site_name: VUEDA
site_description: Implementor guide, changelog, and reference for VUEDA.
site_url: https://docs.arrai.dev/vueda/
repo_name: arrai-innovations/vueda
repo_url: https://github.com/arrai-innovations/vueda
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo-cube.svg
  favicon: assets/logo-cube.svg
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - assets/brand.css

nav:
  - About: index.md
  - Server:
      - Overview: server/index.md
      - Implementor Guide: server/guide/implementor.md
      - Changelog: server/changelog.md
      - Reference: server/reference/index.md
  - Client:
      - Overview: client/index.md
  - API:
      - Overview: api/README.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
