[project]
name = "vueda-docs-tooling"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "pdoc>=16.0.0",
]

[dependency-groups]
dev = [
  "coverage>=7.14.1",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "py" is added directly (not ".") to avoid conflicts with the PyPI `py`
# package and pytest's own tests/py/ collection path.
pythonpath = ["py"]
# importlib mode avoids sys.path-based package traversal, preventing the
# editable-installed `py` package (docs-tooling/py/) from shadowing tests/py/.
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
source = ["./py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
]
