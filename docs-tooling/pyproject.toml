[project]
name = "vueda-docs-tooling"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "pdoc>=14.4.0",
]

[dependency-groups]
test = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "py" is added directly (not ".") to avoid conflicts with the PyPI `py`
# package and pytest's own tests/py/ collection path.
pythonpath = ["py"]
