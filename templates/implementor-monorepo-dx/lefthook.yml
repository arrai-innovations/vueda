commit-msg:
  commands:
    commitlint:
      run: pnpm -C . exec commitlint --edit "$1"

pre-commit:
  parallel: false
  commands:
    fix-server:
      stage_fixed: true
      run: |
        files="$(git diff --name-only --cached -- 'server/**' | grep '\.py$')"
        if [ -n "$files" ]; then
          files="$(printf '%s\n' "$files" | sed 's|^server/||')"
          cd server
          uv run --no-sync ruff check --fix --show-fixes $files
          uv run --no-sync ruff format $files
        fi
    fix-client-eslint:
      stage_fixed: true
      run: |
        files="$(git diff --name-only --cached -- 'client/**' | grep -E '\.(vue|js|cjs|mjs|ts|jsx|tsx)$')"
        if [ -n "$files" ]; then
          files="$(printf '%s\n' "$files" | sed 's|^client/||')"
          pnpm -C client exec eslint --no-warn-ignored --cache --fix $files
        fi
    fix-client-prettier:
      stage_fixed: true
      run: |
        files="$(git diff --name-only --cached -- 'client/**' | grep -E '\.(less|scss|css|vue|markdown|json|md|yml|yaml|html)$')"
        if [ -n "$files" ]; then
          files="$(printf '%s\n' "$files" | sed 's|^client/||')"
          pnpm -C client exec prettier --write $files
        fi
    fix-md-toc:
      stage_fixed: true
      run: |
        files="$(git diff --name-only --cached --diff-filter=d -- '*.md' | grep -vE '/AGENTS?\.md$')"
        if [ -n "$files" ]; then
          uv run --no-sync python -m md_toc -p github $files
        fi

