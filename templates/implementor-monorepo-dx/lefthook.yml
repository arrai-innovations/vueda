commit-msg:
    commands:
        commitlint:
            run: pnpm -C . exec commitlint --edit "$1"

pre-commit:
    parallel: false
    commands:
        fix-server:
            stage_fixed: true
            root: "server/"
            glob: "*.py"
            run: |
                uv run --no-sync ruff check --fix --show-fixes {staged_files}
                uv run --no-sync ruff format {staged_files}
        fix-client-eslint:
            stage_fixed: true
            root: "client/"
            glob: "*.{vue,js,cjs,mjs,ts,jsx,tsx}"
            run: pnpm exec eslint --no-warn-ignored --cache --fix {staged_files}
        fix-client-prettier:
            stage_fixed: true
            root: "client/"
            glob: "*.{less,scss,css,vue,markdown,json,md,yml,yaml,html}"
            run: pnpm exec prettier --write {staged_files}
        fix-md-toc:
            stage_fixed: true
            glob: "*.md"
            exclude: 'AGENTS?\.md$'
            run: uv run --no-sync python -m md_toc -p github {staged_files}
