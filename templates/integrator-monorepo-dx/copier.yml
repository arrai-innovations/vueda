_min_copier_version: "9.0.0"
_templates_suffix: ".jinja"
_exclude:
    - "copier.yaml"
    - "copier.yml"
    - "~*"
    - "*.py[co]"
    - "__pycache__"
    - ".git"
    - ".DS_Store"
    - ".svn"
    - "{% if js_package_manager == 'pnpm' %}.copier-exclude-nothing{% else %}pnpm-workspace.yaml{% endif %}"
_tasks:
    - "# VUEDA DX monorepo template is now in place."
    - "# Next: run `just bootstrap`"
    - "# Then create server/config.local.toml (at minimum: SECRET_KEY)"

project_name:
    type: str
    help: Human-readable project name.

project_slug:
    type: str
    help: Folder-safe slug used in package names.
    default: "{{ project_name | lower | replace(' ', '-') }}"

python_package:
    type: str
    help: Python package name for your Django apps namespace.
    default: "{{ project_slug | replace('-', '_') }}"

client_package_name:
    type: str
    help: NPM package name for the client app.
    default: "{{ project_slug }}-client"

js_package_manager:
    type: str
    help: JavaScript package manager to use for the generated project.
    default: pnpm
    choices:
        - pnpm
        - npm
        - yarn

bind_ip:
    type: str
    help: IP address to bind the development servers to.
    default: "localhost"

server_port:
    type: int
    help: Port for the api development server.
    default: 8000

client_port:
    type: int
    help: Port for the frontend development server.
    default: 5173

csrf_cookie_name:
    type: str
    help: Project-specific CSRF cookie name (avoids collisions across local dev projects).
    default: "{{ project_slug }}-csrf-token"
